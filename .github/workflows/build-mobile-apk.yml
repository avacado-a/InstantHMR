name: Build InstantHMR Mobile Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-app
    paths:
      - 'mobile/**'
      - '.github/workflows/build-mobile-apk.yml'

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        working-directory: mobile
        run: |
          npm install --legacy-peer-deps

      - name: Generate Native Android Project (Expo Prebuild)
        working-directory: mobile
        run: |
          npx expo prebuild --platform android --clean

      - name: Build Release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstantHMR-Mobile-Android-APK
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14

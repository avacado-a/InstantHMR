name: Build and Publish InstantHMR Mobile (Android & iOS)

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-app
    paths:
      - 'mobile/**'
      - '.github/workflows/build-and-publish-mobile.yml'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        working-directory: mobile
        run: |
          npm install --legacy-peer-deps

      - name: Prebuild Native Android Project
        working-directory: mobile
        run: |
          npx expo prebuild --platform android --clean

      - name: Build Standalone APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare Downloadable APK Asset
        run: |
          mkdir -p dist
          APK_SRC=$(find mobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_SRC" ]; then
            cp "$APK_SRC" dist/InstantHMR-v2.0-Android.apk
            echo "Ready: dist/InstantHMR-v2.0-Android.apk ($(du -h dist/InstantHMR-v2.0-Android.apk | cut -f1))"
          else
            echo "APK not found!" && exit 1
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstantHMR-v2.0-Android-APK
          path: dist/InstantHMR-v2.0-Android.apk
          retention-days: 14

  build-ios:
    name: Build iOS IPA & Simulator App
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Active Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app || sudo xcode-select -s /Applications/Xcode_15*.app || true
          xcodebuild -version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Install NPM Dependencies
        working-directory: mobile
        run: |
          npm install --legacy-peer-deps

      - name: Prebuild Native iOS Project
        working-directory: mobile
        run: |
          npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: |
          pod install

      - name: Build Sideloadable iOS IPA (AltStore / Sideloadly / TrollStore)
        working-directory: mobile/ios
        run: |
          mkdir -p build_output
          xcodebuild -workspace InstantHMRStudio.xcworkspace \
                     -scheme InstantHMRStudio \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     archive \
                     -archivePath build_output/InstantHMRStudio.xcarchive

          mkdir -p Payload
          cp -r build_output/InstantHMRStudio.xcarchive/Products/Applications/InstantHMRStudio.app Payload/
          zip -qr InstantHMR-v2.0-iOS-Sideload.ipa Payload
          mkdir -p ../../dist
          cp InstantHMR-v2.0-iOS-Sideload.ipa ../../dist/
          echo "Ready: dist/InstantHMR-v2.0-iOS-Sideload.ipa ($(du -h ../../dist/InstantHMR-v2.0-iOS-Sideload.ipa | cut -f1))"

      - name: Build iOS Simulator App Bundle
        working-directory: mobile/ios
        run: |
          xcodebuild -workspace InstantHMRStudio.xcworkspace \
                     -scheme InstantHMRStudio \
                     -configuration Release \
                     -destination 'generic/platform=iOS Simulator' \
                     -derivedDataPath build_sim \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO

          cd build_sim/Build/Products/Release-iphonesimulator
          zip -qr InstantHMR-v2.0-iOS-Simulator.app.zip InstantHMRStudio.app
          cp InstantHMR-v2.0-iOS-Simulator.app.zip ../../../../../dist/
          echo "Ready: dist/InstantHMR-v2.0-iOS-Simulator.app.zip"

      - name: Upload iOS IPA & Simulator Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InstantHMR-v2.0-iOS-Assets
          path: |
            dist/InstantHMR-v2.0-iOS-Sideload.ipa
            dist/InstantHMR-v2.0-iOS-Simulator.app.zip
          retention-days: 14

  publish-downloads:
    name: Publish GitHub Release Downloads (APK & IPA)
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: InstantHMR-v2.0-Android-APK
          path: release_assets/
        continue-on-error: true

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: InstantHMR-v2.0-iOS-Assets
          path: release_assets/
        continue-on-error: true

      - name: Publish or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la release_assets/ || true
          TAG="mobile-studio-v2.0"
          TITLE="InstantHMR Mobile Studio v2.0 — Android APK & iOS IPA Downloads"

          BODY="## InstantHMR Mobile Studio v2.0 Downloads

          ### 🤖 Android Phone Installation (.apk)
          1. Download **\`InstantHMR-v2.0-Android.apk\`** directly onto your Android phone.
          2. Tap the downloaded file in your browser / file manager to install.
          3. If prompted: toggle **Allow from this source** to proceed with installation.
          4. Open **InstantHMR Studio** and start real-time tracking on Mobile NPU or CPU!

          ---

          ### 🍏 Apple iPhone Installation (.ipa)
          Apple's direct equivalent of an Android APK is an **\`.ipa\`** file:
          1. Download **\`InstantHMR-v2.0-iOS-Sideload.ipa\`**.
          2. Sideload and install onto your iPhone using any standard tool:
             - **AltStore** (free, wireless / USB sideloading without jailbreak)
             - **Sideloadly** (free, drag-and-drop the .ipa, enter your Apple ID, installs in 10 seconds)
             - **TrollStore** / **Scarlet** (direct on-device .ipa installation)
             - **Apple Configurator** or **Xcode**
          3. On your iPhone: go to **Settings > General > VPN & Device Management** > tap your Apple ID and tap **Trust**.
          4. For Mac developers / Xcode Simulator: download **\`InstantHMR-v2.0-iOS-Simulator.app.zip\`**, unzip, and drag into Simulator."

          # Delete existing tag release if present so latest build replaces it
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

          # Create fresh release with all downloaded assets
          FILES=(release_assets/*)
          if [ ${#FILES[@]} -gt 0 ] && [ -e "${FILES[0]}" ]; then
            gh release create "$TAG" "${FILES[@]}" \
              --title "$TITLE" \
              --notes "$BODY" \
              --target mobile-app \
              --prerelease=false
            echo "Successfully published release: $TAG"
          else
            echo "No build assets found to publish."
          fi

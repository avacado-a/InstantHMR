name: Build and Publish InstantHMR Mobile Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-app
    paths:
      - 'mobile/**'
      - '.github/workflows/build-and-publish-mobile.yml'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install NPM Dependencies
        working-directory: mobile
        run: |
          npm install --legacy-peer-deps

      - name: Prebuild Native Android Project
        working-directory: mobile
        run: |
          npx expo prebuild --platform android --clean --no-install

      - name: Build Standalone APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -Pandroid.kotlinVersion=1.9.25 \
            -PkotlinVersion=1.9.25 \
            -Pandroidx.compose.compiler.plugins.kotlin.suppressKotlinVersionCompatibilityCheck=true \
            --no-daemon \
            --stacktrace

      - name: Prepare Downloadable APK Asset
        run: |
          mkdir -p dist
          APK_SRC=$(find mobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_SRC" ]; then
            cp "$APK_SRC" dist/InstantHMR-v2.0-Android.apk
            echo "Ready: dist/InstantHMR-v2.0-Android.apk ($(du -h dist/InstantHMR-v2.0-Android.apk | cut -f1))"
          else
            echo "APK not found!" && exit 1
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstantHMR-v2.0-Android-APK
          path: dist/InstantHMR-v2.0-Android.apk
          retention-days: 14

  publish-release:
    name: Publish GitHub Release (Android APK Download)
    needs: [build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: InstantHMR-v2.0-Android-APK
          path: release_assets/

      - name: Publish or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la release_assets/
          TAG="mobile-studio-v2.0"
          TITLE="InstantHMR Mobile Studio v2.0 — Android APK Direct Download"

          BODY="## InstantHMR Mobile Studio v2.0 (Android Download)

          ### 🤖 Android Phone Installation (.apk)
          1. Download **\`InstantHMR-v2.0-Android.apk\`** directly onto your Android phone from the assets below.
          2. Tap the downloaded file in your browser or file manager.
          3. If prompted: toggle **Allow from this source** to proceed with installation.
          4. Launch **InstantHMR Studio** to run real-time 3D human mesh & 70-keypoint pose estimation on your mobile NPU or CPU!

          ---

          ### 🍏 iOS Users
          Due to Apple platform restrictions, direct sideload releases are not natively hosted. iOS users can run InstantHMR Studio natively on iPhone by following the Mac & Xcode instructions in the repository README:
          \`\`\`bash
          git checkout mobile-app
          cd mobile
          npm run ios -- --device
          \`\`\`"

          # Clean up any existing tag release so latest APK replaces it
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

          gh release create "$TAG" release_assets/InstantHMR-v2.0-Android.apk \
            --title "$TITLE" \
            --notes "$BODY" \
            --target mobile-app \
            --prerelease=false

          echo "Successfully published release: $TAG"
